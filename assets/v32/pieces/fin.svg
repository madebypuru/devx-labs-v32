@keyframes dx-fin_am1{0%{stroke-dashoffset:15}76.818%{stroke-dashoffset:15;animation-timing-function:cubic-bezier(0.23,1,0.32,1)}82.955%{stroke-dashoffset:0}100%{stroke-dashoffset:0}}
@keyframes dx-fin_glow{0%{opacity:0}63.636%{opacity:0;animation-timing-function:cubic-bezier(0.23,1,0.32,1)}70.455%{opacity:.32;animation-timing-function:cubic-bezier(0.23,1,0.32,1)}90.909%{opacity:0}100%{opacity:0}}
