@keyframes dx-fin_feed{0%{transform:translate(0px,0px)}17.045%{transform:translate(0px,0px);animation-timing-function:cubic-bezier(0.32,0.72,0,1)}28.409%{transform:translate(0px,-26px)}67.045%{transform:translate(0px,-26px);animation-timing-function:cubic-bezier(0.32,0.72,0,1)}78.409%{transform:translate(0px,-52px)}100%{transform:translate(0px,-52px)}}
@keyframes dx-fin_old0{0%{opacity:1}17.045%{opacity:1;animation-timing-function:cubic-bezier(0.23,1,0.32,1)}25%{opacity:0}100%{opacity:0}}
@keyframes dx-fin_it0{0%{stroke-dashoffset:35}20.455%{stroke-dashoffset:35;animation-timing-function:cubic-bezier(0.23,1,0.32,1)}29.545%{stroke-dashoffset:0}100%{stroke-dashoffset:0}}
@keyframes dx-fin_am0{0%{stroke-dashoffset:21}26.818%{stroke-dashoffset:21;animation-timing-function:cubic-bezier(0.23,1,0.32,1)}32.955%{stroke-dashoffset:0}100%{stroke-dashoffset:0}}
@keyframes dx-fin_old1{0%{opacity:1}67.045%{opacity:1;animation-timing-function:cubic-bezier(0.23,1,0.32,1)}75%{opacity:0}100%{opacity:0}}
