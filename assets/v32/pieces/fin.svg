<svg class="dx-fin" xmlns="http://www.w3.org/2000/svg" width="372" height="300" viewBox="0 0 372 300" fill="none" stroke="#14162e" role="img" aria-labelledby="dx-fin-t" aria-describedby="dx-fin-d">
<title id="dx-fin-t">Answer costs</title>
<desc id="dx-fin-d">A column of glass coins beside a tall frosted receipt on a blue field: each time an answer is served a coin drops onto the column, then a new line item prints on the receipt and the total updates.</desc>
<style>
@scope (svg.dx-fin) {
:scope{stroke:none;--_dx-field:#658ff8;--_dx-top:#9b8cf7;--_dx-fringe:#ffe27a;--_dx-white:#ffffff;--_dx-paper:#f7f6f3;--_dx-ink:#14162e;--_dx-live:#0bf789;--_dx-alert:#ff381c;--_dx-chip:#f1f1f1;--_dx-glow:#4b9efe}
@media (prefers-color-scheme: dark){:scope{--_dx-field:#658ff8;--_dx-top:#9b8cf7;--_dx-fringe:#ffe27a;--_dx-white:#ffffff;--_dx-paper:#f7f6f3;--_dx-ink:#14162e;--_dx-live:#0bf789;--_dx-alert:#ff381c;--_dx-chip:#f1f1f1;--_dx-glow:#4b9efe}}
.fld{fill:var(--illos-dx-field,var(--_dx-field))}
.st-top{stop-color:var(--illos-dx-top,var(--_dx-top))}.st-fld{stop-color:var(--illos-dx-field,var(--_dx-field))}.st-w{stop-color:var(--illos-dx-white,var(--_dx-white))}.st-fr{stop-color:var(--illos-dx-fringe,var(--_dx-fringe))}
.pap{fill:var(--illos-dx-paper,var(--_dx-paper))}.tp{fill:var(--illos-dx-top,var(--_dx-top))}.frn{fill:var(--illos-dx-fringe,var(--_dx-fringe))}.wht{fill:var(--illos-dx-white,var(--_dx-white))}.ink{fill:var(--illos-dx-ink,var(--_dx-ink))}
.wl{fill:none;stroke:var(--illos-dx-white,var(--_dx-white))}.fld-s{stroke:var(--illos-dx-field,var(--_dx-field))}
.chp{fill:var(--illos-dx-chip,var(--_dx-chip))}.chs{fill:var(--illos-dx-glow,var(--_dx-glow))}
.liv{fill:var(--illos-dx-live,var(--_dx-live))}.alr{fill:var(--illos-dx-alert,var(--_dx-alert))}
.cur{fill:var(--illos-dx-ink,var(--_dx-ink));stroke:var(--illos-dx-white,var(--_dx-white));stroke-width:1.6px;stroke-linejoin:round}
.txt{fill:var(--illos-dx-white,var(--_dx-white));font-family:"Inter Display",Inter,system-ui,sans-serif;font-size:10.26px;letter-spacing:-.2px}
.gr{fill:var(--illos-dx-white,var(--_dx-white))}
.drop0{transform:translate(0px,-170px);animation:dx-fin_drop0 4.4s linear}
.drop1{transform:translate(0px,-170px);animation:dx-fin_drop1 4.4s linear}
.sink{transform:translate(0px,0px);animation:dx-fin_sink 4.4s linear}
.feed{transform:translate(0px,0px);animation:dx-fin_feed 4.4s linear}
.old0{opacity:1;animation:dx-fin_old0 4.4s linear}
.it0{stroke-dashoffset:35;animation:dx-fin_it0 4.4s linear}
.am0{stroke-dashoffset:21;animation:dx-fin_am0 4.4s linear}
.old1{opacity:1;animation:dx-fin_old1 4.4s linear}
.it1{stroke-dashoffset:51;animation:dx-fin_it1 4.4s linear}
.am1{stroke-dashoffset:15;animation:dx-fin_am1 4.4s linear}
.glow{opacity:0;animation:dx-fin_glow 2.2s linear}
