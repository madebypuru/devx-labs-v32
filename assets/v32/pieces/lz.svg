.fld{fill:var(--illos-dx-field,var(--_dx-field))}
.st-top{stop-color:var(--illos-dx-top,var(--_dx-top))}.st-fld{stop-color:var(--illos-dx-field,var(--_dx-field))}.st-w{stop-color:var(--illos-dx-white,var(--_dx-white))}.st-fr{stop-color:var(--illos-dx-fringe,var(--_dx-fringe))}
