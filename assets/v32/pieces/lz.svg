.wave{transform-box:fill-box;transform-origin:50% 50%;opacity:0;animation:dx-lz_wave 4.4s linear}
.drop{animation:dx-lz_drop 4.4s linear}
.fade{transform-box:fill-box;transform-origin:50% 50%;animation:dx-lz_fade 4.4s linear}
