@keyframes dx-lz_wave{0%{opacity:0;transform:scale(1)}36.364%{opacity:0;transform:scale(1);animation-timing-function:cubic-bezier(0.23,1,0.32,1)}37.273%{opacity:.9;transform:scale(1);animation-timing-function:cubic-bezier(0.23,1,0.32,1)}54.545%{opacity:0;transform:scale(1.75)}100%{opacity:0;transform:scale(1)}}
@keyframes dx-lz_drop{0%{transform:translate(0px,0px)}4.545%{transform:translate(0px,0px);animation-timing-function:cubic-bezier(0.23,1,0.32,1)}31.818%{transform:translate(0px,116px);animation-timing-function:cubic-bezier(0.23,1,0.32,1)}35.227%{transform:translate(0px,113.5px);animation-timing-function:cubic-bezier(0.23,1,0.32,1)}39.773%{transform:translate(0px,115px)}75%{transform:translate(0px,115px)}75.455%{transform:translate(0px,0px)}100%{transform:translate(0px,0px)}}
@keyframes dx-lz_fade{0%{opacity:1;transform:scale(1)}59.091%{opacity:1;transform:scale(1);animation-timing-function:cubic-bezier(0.23,1,0.32,1)}75%{opacity:0;transform:scale(.96)}77.273%{opacity:0;transform:scale(.92);animation-timing-function:cubic-bezier(0.23,1,0.32,1)}95.455%{opacity:1;transform:scale(1)}100%{opacity:1;transform:scale(1)}}
