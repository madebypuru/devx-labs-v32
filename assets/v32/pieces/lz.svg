<svg class="dx-lz" xmlns="http://www.w3.org/2000/svg" width="372" height="300" viewBox="0 0 372 300" fill="none" stroke="#14162e" role="img" aria-labelledby="dx-lz-t" aria-describedby="dx-lz-d">
<title id="dx-lz-t">AI landing zone</title>
<desc id="dx-lz-d">A wide glass base on a cyan field, the ground floor of the platform: a workload comes down and lands inside its ring, and the base lights as it takes it in.</desc>
<style>
@scope (svg.dx-lz) {
:scope{stroke:none;--_dx-field:#6ac7dc;--_dx-top:#9b8cf7;--_dx-fringe:#ffe27a;--_dx-white:#ffffff;--_dx-paper:#f7f6f3;--_dx-ink:#14162e;--_dx-live:#0bf789;--_dx-alert:#ff381c;--_dx-chip:#f1f1f1;--_dx-glow:#4b9efe}
